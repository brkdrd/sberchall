services:
  train:
    build: .
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # fallback for machines without an NVIDIA runtime (slow but functional)
  train-cpu:
    build: .
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data

  # the same entry point Kaggle runs: preflight -> train -> validate -> summary,
  # configured by CONFIG in src/experiment.py
  experiment:
    build: .
    command: python -m src
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  predict:
    build: .
    command: python -m src.predict
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # full inference stack (best-of-K rollouts + Adam polish) scored on h_train
  validate:
    build: .
    command: python -m src.validate
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
